services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: statementiq-backend
    environment:
      # The only origin the containerized frontend can present.
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: statementiq-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
